[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic7300mk2"
version = "0.1.0"
description = "Python SDK for the ICOM IC-7300MK2 network CI-V (LAN) control interface"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Thad Turner" }]
keywords = ["icom", "ic-7300", "ci-v", "ham-radio", "cat-control", "rs-ba1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []

[dependency-groups]
dev = ["pytest>=7"]

[project.urls]
Documentation = "https://github.com/thadigus/7300mk2-control/tree/main/ai-docs"

[tool.hatch.build.targets.wheel]
packages = ["ic7300mk2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
